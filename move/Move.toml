[package]
name = "custodia"
edition = "2024"

# No [dependencies] block: the Sui framework and MoveStdlib are resolved
# automatically by Sui CLI v1.63+. Adding an explicit
#   Sui = { git = "https://github.com/MystenLabs/sui.git", ... }
# entry is what produces the "Dependency 'Sui' is a legacy system name"
# build error — verified against the installed `sui-move-project` skill.
#
# No [addresses] block either: the old `custodia = "0x0"` form is superseded.
# The published address is tracked in Published.toml, which the toolchain
# creates on first `sui client publish`.
#
# Add an [environments] section only if a build actually fails with
# "Could not determine the correct dependencies" — it maps environment
# names to chain IDs and is only needed for multi-network deploys.
