[package]
name = "custodia"
edition = "2024"

# SuiNS core, added 2026-08-31 for `agent_identity::verify_name`. The type
# SuinsRegistration and its `domain_name()` getter were verified against the
# suins-contracts source this session (rule 1), not assumed.
[dependencies]
suins = { git = "https://github.com/mystenlabs/suins-contracts.git", subdir = "packages/suins", rev = "releases/mainnet/core/v3" }

# No explicit Sui/MoveStdlib entry: the framework is resolved automatically by
# Sui CLI v1.63+, and suins pulls the same framework transitively. Adding an
# explicit Sui git dep is what produces the "legacy system name" error.
